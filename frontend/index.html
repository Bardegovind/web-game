<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <meta name="description" content="Play Tic Tac Toe with a friend — classic X and O game">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&display=swap"
        rel="stylesheet">
    <!-- Imported into a cascade layer so the chamber's utilities can win
         inside the chamber. Loaded unlayered, the game's `*` reset beats every
         layered rule regardless of specificity. -->
    <style>
        @layer game;
        @import url("/css/style.css") layer(game);
    </style>
</head>

<body>
    <!-- Background Effects -->
    <div class="bg-effects" aria-hidden="true">
        <div class="particle p1"></div>
        <div class="particle p2"></div>
        <div class="particle p3"></div>
        <div class="particle p4"></div>
        <div class="particle p5"></div>
        <div class="particle p6"></div>
        <div class="particle p7"></div>
        <div class="particle p8"></div>
        <div class="scan-line"></div>
    </div>

    <!-- ========================
         GAME VIEW
         ======================== -->
    <div id="game-view" class="view active">
        <!-- Hidden tap zones (invisible). The ritual is frozen: 16, then 3, then 7. -->
        <div id="hidden-tap-1" class="hidden-tap top-left" data-tap="1"></div>
        <div id="hidden-tap-2" class="hidden-tap top-right" data-tap="2"></div>
        <div id="hidden-tap-3" class="hidden-tap bottom-right" data-tap="3"></div>

        <div class="game-container">
            <div class="game-header">
                <h1 class="game-title">Tic Tac Toe</h1>
                <p class="game-subtitle" id="game-status">Player X's Turn</p>
            </div>

            <div class="scoreboard">
                <div class="score-card x-score">
                    <span class="score-label">Player X</span>
                    <span class="score-value" id="score-x">0</span>
                    <span class="score-tag win-tag">WINS</span>
                </div>
                <div class="score-card draw-score">
                    <span class="score-label">Draw</span>
                    <span class="score-value" id="score-draw">0</span>
                    <span class="score-tag draw-tag">TIES</span>
                </div>
                <div class="score-card o-score">
                    <span class="score-label">Player O</span>
                    <span class="score-value" id="score-o">0</span>
                    <span class="score-tag win-tag">WINS</span>
                </div>
            </div>

            <div class="board" id="board">
                <div class="cell" data-cell="0"></div>
                <div class="cell" data-cell="1"></div>
                <div class="cell" data-cell="2"></div>
                <div class="cell" data-cell="3"></div>
                <div class="cell" data-cell="4"></div>
                <div class="cell" data-cell="5"></div>
                <div class="cell" data-cell="6"></div>
                <div class="cell" data-cell="7"></div>
                <div class="cell" data-cell="8"></div>
            </div>

            <div class="result-banner" id="result-banner">
                <div class="result-icon" id="result-icon">🏆</div>
                <div class="result-text" id="result-text">Player X Wins!</div>
            </div>

            <div class="game-actions">
                <button class="btn btn-primary" id="btn-restart">New Game</button>
                <button class="btn btn-secondary" id="btn-reset-scores">Reset Scores</button>
            </div>
        </div>
    </div>

    <!-- ==================== -->
    <!-- PASSWORD MODAL -->
    <!-- ==================== -->
    <div id="password-modal" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-header">
                <div class="modal-icon">🔐</div>
                <h2 class="modal-title">Enter Password</h2>
                <p class="modal-subtitle">Access requires authentication</p>
            </div>
            <div class="modal-body">
                <div class="input-group">
                    <input type="text" id="input-username" class="input-field" placeholder="Username" autocomplete="off"
                        spellcheck="false">
                </div>
                <div class="input-group">
                    <input type="password" id="input-password" class="input-field" placeholder="Password"
                        autocomplete="off">
                </div>
                <div class="modal-error" id="modal-error"></div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-primary btn-full" id="btn-submit-password">Enter</button>
                <button class="btn btn-ghost" id="btn-cancel-password">Cancel</button>
            </div>
        </div>
    </div>

    <!-- The chamber mounts here once the password is accepted. It has no url of
         its own, so there is nothing to stumble onto. -->
    <div id="chamber-root"></div>

    <!-- The game and the entrance ritual stay vanilla on purpose. -->
    <script src="/js/api.js"></script>
    <script src="/js/tapSequence.js"></script>
    <script src="/js/tapZones.js"></script>
    <script src="/js/game.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/chamber.js"></script>

    <script type="module" src="/chamber/main.tsx"></script>
</body>

</html>
